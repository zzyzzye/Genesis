# 与 compose.yml 或 compose.prod.yml 合并使用；不发布监控端口。
services:
  backend:
    volumes:
      - ./monitoring/runtime:/host-monitor:ro
  host-processes:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/python:3.12-slim-bookworm
    restart: unless-stopped
    command: [python, -B, /collector.py]
    read_only: true
    cgroup: host
    cap_drop: [ALL]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - ./backend/src/genesis_api/host_monitor.py:/collector.py:ro
    mem_limit: 128m
    cpus: 0.25
    security_opt: [no-new-privileges:true]
  node-systemd:
    image: quay.io/prometheus/node-exporter:v1.10.2
    profiles: [host-services]
    restart: unless-stopped
    user: '65534:65534'
    command:
      - --collector.disable-defaults
      - --collector.systemd
      - '--collector.systemd.unit-include=.+\.service'
      - --collector.systemd.enable-restarts-metrics
      - --collector.systemd.enable-start-time-metrics
    read_only: true
    cap_drop: [ALL]
    volumes:
      - type: bind
        source: /run/dbus/system_bus_socket
        target: /var/run/dbus/system_bus_socket
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 128m
    cpus: 0.25
    security_opt: [no-new-privileges:true]
  prometheus:
    image: quay.io/prometheus/prometheus:v3.13.5
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 512m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.10.2
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.loadavg
      - --collector.filesystem
      - --collector.diskstats
      - --collector.textfile
      - --collector.textfile.directory=/host-textfile
    volumes:
      - /:/host:ro
      - ./monitoring/runtime:/host-textfile:ro
    mem_limit: 128m
    cpus: 0.25
    security_opt: [no-new-privileges:true]
  node-network:
    image: quay.io/prometheus/node-exporter:v1.10.2
    restart: unless-stopped
    # 从宿主 PID 1 的网络命名空间读计数，避免误报 exporter 容器流量。
    command:
      - --path.procfs=/host/proc/1
      - --collector.disable-defaults
      - --collector.netdev
      - --no-collector.netdev.netlink
    volumes:
      - /proc:/host/proc:ro
    mem_limit: 64m
    cpus: 0.25
    security_opt: [no-new-privileges:true]
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    restart: unless-stopped
    cgroup: host
    command:
      - --docker_only=true
      - --containerd=/rootfs/run/containerd/containerd.sock
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --disable_metrics=percpu,sched,tcp,udp,hugetlb,referenced_memory,resctrl
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    mem_limit: 256m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
volumes:
  prometheus_data:
