name: genesis

services:
  backend:
    platform: linux/amd64
    build:
      context: ./backend
      target: development
    environment:
      GENESIS_ENVIRONMENT: development
      GENESIS_DEBUG: "false"
      GENESIS_CORS_ORIGINS: '["http://localhost:5173"]'
    init: true
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    platform: linux/amd64
    build:
      context: ./frontend
      target: development
    command: >-
      sh -c "npm ci --prefer-offline --no-audit && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    init: true
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_npm_cache:/home/node/.npm
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  frontend_node_modules:
  frontend_npm_cache:
