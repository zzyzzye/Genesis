name: genesis

services:
  postgres:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/postgres:16-alpine
    platform: linux/amd64
    environment:
      POSTGRES_DB: genesis
      POSTGRES_USER: genesis
      POSTGRES_PASSWORD: genesis
    init: true
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genesis -d genesis"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    platform: linux/amd64
    build:
      context: ./backend
      target: development
    environment:
      GENESIS_ENVIRONMENT: ${GENESIS_ENVIRONMENT:-development}
      GENESIS_DEBUG: ${GENESIS_DEBUG:-false}
      GENESIS_CORS_ORIGINS: '${GENESIS_CORS_ORIGINS:-["http://localhost:5173"]}'
      GENESIS_DATABASE_HOST: ${GENESIS_DATABASE_HOST:-postgres}
      GENESIS_DATABASE_PORT: ${GENESIS_DATABASE_PORT:-5432}
      GENESIS_DATABASE_NAME: ${GENESIS_DATABASE_NAME:-genesis}
      GENESIS_DATABASE_USER: ${GENESIS_DATABASE_USER:-genesis}
      GENESIS_DATABASE_PASSWORD: ${GENESIS_DATABASE_PASSWORD:-genesis}
      GENESIS_JWT_SECRET: ${GENESIS_JWT_SECRET:-development-only-jwt-secret-do-not-use-in-production}
      GENESIS_DEVELOPMENT_OWNER_PASSWORD: ${GENESIS_DEVELOPMENT_OWNER_PASSWORD:-genesis-local-only}
      GENESIS_TEXT_PROVIDER: ${GENESIS_TEXT_PROVIDER:-openai}
      GENESIS_TEXT_OPENAI_API_KEY: ${GENESIS_TEXT_OPENAI_API_KEY:-}
      GENESIS_TEXT_OPENAI_BASE_URL: ${GENESIS_TEXT_OPENAI_BASE_URL:-https://api.openai.com/v1}
      GENESIS_TEXT_OPENAI_MODEL: ${GENESIS_TEXT_OPENAI_MODEL:-}
      GENESIS_TEXT_GROK_API_KEY: ${GENESIS_TEXT_GROK_API_KEY:-}
      GENESIS_TEXT_GROK_BASE_URL: ${GENESIS_TEXT_GROK_BASE_URL:-https://api.x.ai/v1}
      GENESIS_TEXT_GROK_MODEL: ${GENESIS_TEXT_GROK_MODEL:-}
      GENESIS_TEXT_GEMINI_API_KEY: ${GENESIS_TEXT_GEMINI_API_KEY:-}
      GENESIS_TEXT_GEMINI_BASE_URL: ${GENESIS_TEXT_GEMINI_BASE_URL:-https://www.yyapi.cloud/}
      GENESIS_TEXT_GEMINI_MODEL: ${GENESIS_TEXT_GEMINI_MODEL:-}
      GENESIS_TEXT_CLAUDE_API_KEY: ${GENESIS_TEXT_CLAUDE_API_KEY:-}
      GENESIS_TEXT_CLAUDE_BASE_URL: ${GENESIS_TEXT_CLAUDE_BASE_URL:-https://api.anthropic.com}
      GENESIS_TEXT_CLAUDE_MODEL: ${GENESIS_TEXT_CLAUDE_MODEL:-}
      GENESIS_TEXT_TEMPERATURE: ${GENESIS_TEXT_TEMPERATURE:-0.7}
      GENESIS_TEXT_MAX_TOKENS: ${GENESIS_TEXT_MAX_TOKENS:-4096}
    init: true
    command: >-
      sh -c "alembic upgrade head && python -m genesis_api.database.seed && fastapi dev src/genesis_api/main.py --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    platform: linux/amd64
    build:
      context: ./frontend
      target: development
    command: >-
      sh -c "if [ ! -x node_modules/.bin/vite ] || [ ! -d node_modules/react-router-dom ] || [ ! -d node_modules/@codemirror/view ]; then npm ci --prefer-offline --no-audit; fi && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    init: true
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_npm_cache:/home/node/.npm
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  frontend_node_modules:
  frontend_npm_cache:
  postgres_data:
