name: genesis-production

services:
  postgres:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/postgres:16-alpine
    platform: linux/amd64
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: genesis
      POSTGRES_USER: genesis
      POSTGRES_PASSWORD: ${GENESIS_POSTGRES_PASSWORD:?请先设置 GENESIS_POSTGRES_PASSWORD}
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genesis -d genesis"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  migrate:
    image: genesis-production-backend
    platform: linux/amd64
    build:
      context: ./backend
      target: production
      labels:
        cn.genesis.production: "true"
    command: ["alembic", "upgrade", "head"]
    environment:
      GENESIS_ENVIRONMENT: production
      GENESIS_DEBUG: "false"
      PYTHONPATH: /app/src
      GENESIS_JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${GENESIS_JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      GENESIS_JWT_REFRESH_TOKEN_EXPIRE_MINUTES: ${GENESIS_JWT_REFRESH_TOKEN_EXPIRE_MINUTES:-1440}
      GENESIS_CORS_ORIGINS: "[]"
      GENESIS_DATABASE_HOST: postgres
      GENESIS_DATABASE_NAME: genesis
      GENESIS_DATABASE_USER: genesis
      GENESIS_DATABASE_PASSWORD: ${GENESIS_POSTGRES_PASSWORD:?请先设置 GENESIS_POSTGRES_PASSWORD}
      GENESIS_JWT_SECRET: ${GENESIS_JWT_SECRET:?请先设置 GENESIS_JWT_SECRET}
      GENESIS_AGENT_ACTION_SECRET: ${GENESIS_AGENT_ACTION_SECRET:?请先设置 GENESIS_AGENT_ACTION_SECRET}
    init: true
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: genesis-production-backend
    platform: linux/amd64
    build:
      context: ./backend
      target: production
      labels:
        cn.genesis.production: "true"
    environment:
      GENESIS_ENVIRONMENT: production
      GENESIS_DEBUG: "false"
      PYTHONPATH: /app/src
      GENESIS_JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${GENESIS_JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      GENESIS_JWT_REFRESH_TOKEN_EXPIRE_MINUTES: ${GENESIS_JWT_REFRESH_TOKEN_EXPIRE_MINUTES:-1440}
      GENESIS_CORS_ORIGINS: "[]"
      GENESIS_DATABASE_HOST: postgres
      GENESIS_DATABASE_NAME: genesis
      GENESIS_DATABASE_USER: genesis
      GENESIS_DATABASE_PASSWORD: ${GENESIS_POSTGRES_PASSWORD:?请先设置 GENESIS_POSTGRES_PASSWORD}
      GENESIS_JWT_SECRET: ${GENESIS_JWT_SECRET:?请先设置 GENESIS_JWT_SECRET}
      GENESIS_TEXT_MIMO_API_KEY: ${GENESIS_TEXT_MIMO_API_KEY:-}
      GENESIS_TEXT_MIMO_BASE_URL: ${GENESIS_TEXT_MIMO_BASE_URL:-https://api.xiaomimimo.com/v1}
      GENESIS_TEXT_MIMO_MODEL: ${GENESIS_TEXT_MIMO_MODEL:-mimo-v2.6-flash}
      GENESIS_TEXT_PROVIDER: ${GENESIS_TEXT_PROVIDER:-openai}
      GENESIS_TEXT_OPENAI_API_KEY: ${GENESIS_TEXT_OPENAI_API_KEY:-}
      GENESIS_TEXT_OPENAI_BASE_URL: ${GENESIS_TEXT_OPENAI_BASE_URL:-https://api.openai.com/v1}
      GENESIS_TEXT_OPENAI_MODEL: ${GENESIS_TEXT_OPENAI_MODEL:-}
      GENESIS_TEXT_GROK_API_KEY: ${GENESIS_TEXT_GROK_API_KEY:-}
      GENESIS_TEXT_GROK_BASE_URL: ${GENESIS_TEXT_GROK_BASE_URL:-https://api.x.ai/v1}
      GENESIS_TEXT_GROK_MODEL: ${GENESIS_TEXT_GROK_MODEL:-}
      GENESIS_TEXT_GEMINI_API_KEY: ${GENESIS_TEXT_GEMINI_API_KEY:-}
      GENESIS_TEXT_GEMINI_BASE_URL: ${GENESIS_TEXT_GEMINI_BASE_URL:-https://www.yyapi.cloud/}
      GENESIS_TEXT_GEMINI_MODEL: ${GENESIS_TEXT_GEMINI_MODEL:-}
      GENESIS_TEXT_CLAUDE_API_KEY: ${GENESIS_TEXT_CLAUDE_API_KEY:-}
      GENESIS_TEXT_CLAUDE_BASE_URL: ${GENESIS_TEXT_CLAUDE_BASE_URL:-https://api.anthropic.com}
      GENESIS_TEXT_CLAUDE_MODEL: ${GENESIS_TEXT_CLAUDE_MODEL:-}
      GENESIS_TEXT_TEMPERATURE: ${GENESIS_TEXT_TEMPERATURE:-0.7}
      GENESIS_VIDEO_API_KEY: ${GENESIS_VIDEO_API_KEY:-${VIDEO_API_KEY:-}}
      GENESIS_VIDEO_API_BASE_URL: ${GENESIS_VIDEO_API_BASE_URL:-https://zl.yyapi.cloud}
      GENESIS_VIDEO_PUBLIC_BASE_URL: ${GENESIS_VIDEO_PUBLIC_BASE_URL:-}
      GENESIS_IMAGE_API_KEY: ${GENESIS_IMAGE_API_KEY:-}
      GENESIS_IMAGE_API_BASE_URL: ${GENESIS_IMAGE_API_BASE_URL:-https://zl.yyapi.cloud}
      GENESIS_TEXT_MAX_TOKENS: ${GENESIS_TEXT_MAX_TOKENS:-4096}
      GENESIS_YYAPI_ACCESS_TOKEN: ${GENESIS_YYAPI_ACCESS_TOKEN:-}
      GENESIS_YYAPI_USER_ID: ${GENESIS_YYAPI_USER_ID:-null}
      GENESIS_YYAPI_CONTROL_BASE_URL: ${GENESIS_YYAPI_CONTROL_BASE_URL:-https://www.yyapi.cloud}
      GENESIS_YYAPI_PROXY_URL: ${GENESIS_YYAPI_PROXY_URL:-}
      GENESIS_AGENT_ACTION_SECRET: ${GENESIS_AGENT_ACTION_SECRET:?请先设置 GENESIS_AGENT_ACTION_SECRET}
      GENESIS_AGENT_MAX_CONCURRENT_RUNS: ${GENESIS_AGENT_MAX_CONCURRENT_RUNS:-4}
    expose:
      - "8000"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - media_data:/data/media
      - ./backend/src:/app/src:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    platform: linux/amd64
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/nginx:alpine
    volumes:
      - frontend_releases:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend-build:
    profiles: [deploy]
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/node:22-alpine
    platform: linux/amd64
    working_dir: /work
    volumes:
      - ./frontend:/source:ro
      - ./scripts/production-frontend.sh:/deploy/frontend.sh:ro
      - frontend_dependencies:/work/node_modules
      - frontend_releases:/artifacts
    entrypoint: [sh, /deploy/frontend.sh]

volumes:
  media_data:
  postgres_data:
  frontend_dependencies:
  frontend_releases:
