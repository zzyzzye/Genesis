map $http_x_forwarded_proto $public_scheme {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/current;
    index index.html;

    # 素材短期授权放在查询参数中，不写入代理访问日志。
    location ^~ /api/v1/media/video-references/ {
        access_log off;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        client_max_body_size 201m;
        proxy_read_timeout 300s;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_scheme;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8000/api/v1/blog/seo/sitemap.xml$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $public_scheme;
    }

    location = /robots.txt {
        proxy_pass http://backend:8000/api/v1/blog/seo/robots.txt;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $public_scheme;
    }

    location = /index.html {
        ssi on;
        ssi_value_length 4096;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
