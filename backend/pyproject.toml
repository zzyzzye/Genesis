[project]
name = "genesis-api"
version = "0.1.0"
description = "Genesis FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ag-ui-langgraph==0.0.47",
    "ag-ui-protocol>=0.1.22,<1",
    "alembic>=1.19.1",
    "anthropic>=1.7.0",
    "deepagents>=0.7.13",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.1",
    "langchain-docling>=3.0.0,<4",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.0",
    "langchain-xai>=1.3.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.0.0",
    "psycopg[binary]>=3.3.5",
    "docling-slim[format-docx,format-pdf]>=2.143.0,<3",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.52",
    "torch>=2.2.2,<3",
    "ua-parser>=1.0.1,<2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pypdf>=6.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "types-pyyaml>=6.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genesis_api"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=genesis_api --cov-report=term-missing --cov-fail-under=90"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
# 外部文档转换库包含庞大的模型依赖；仅检查项目适配代码，不递归分析其实现。
module = ["docling.*", "langchain_docling.*"]
follow_imports = "skip"

[tool.coverage.run]
branch = true
source = ["genesis_api"]

[tool.coverage.report]
show_missing = true
skip_covered = true
