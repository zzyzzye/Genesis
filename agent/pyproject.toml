[project]
name = "genesis-agent"
version = "0.1.0"
description = "Standalone Genesis LangGraph agent"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.13",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.1",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.0",
    "langchain-xai>=1.3.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langgraph-cli[inmem]>=0.4.0",
    "pydantic-settings>=2.15.0",
    "psycopg[binary]>=3.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genesis_agent"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = ["mypy>=2.3.1", "pytest>=9.1.1", "ruff>=0.16.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
