global:
  scrape_interval: 30s
  scrape_timeout: 10s
scrape_configs:
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: node-network
    static_configs:
      - targets: [node-network:9100]
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
    metric_relabel_configs:
      - action: labeldrop
        regex: 'container_label_.*|container_env_.*'
